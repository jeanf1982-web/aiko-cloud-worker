name: AIKO Cloud Evolution Quality Gate
on:
  push:
    branches: [main, 'aiko-*']
    paths:
      - 'cloud_b8_003/**'
      - 'tests/**'
      - 'project_boundary.py'
      - 'worker.py'
      - 'cloud_delivery_verify.py'
      - 'keys/**'
      - 'aiko_cloud_chess_executor.py'
      - 'aiko_cloud_jobs.json'
      - '.github/workflows/aiko-cloud-worker.yml'
      - '.github/workflows/aiko-cloud-chess-executor.yml'
      - '.github/workflows/aiko-cloud-evolution-quality-gate.yml'
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: aiko-cloud-evolution-quality-gate
  cancel-in-progress: false
jobs:
  independent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cloud-only repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deterministic cloud quality audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, time
          root=pathlib.Path(".")
          omit={".git",".venv","venv","node_modules","__pycache__",".next"}
          examined=[]; failures=[]
          for p in root.rglob("*"):
              if not p.is_file() or any(v in omit for v in p.parts):
                  continue
              if p.stat().st_size>500_000:
                  continue
              if p.suffix not in {".py",".json"}:
                  continue
              if len(examined)>=300:
                  failures.append({"kind":"LIMIT","reason":"300 files max"});break
              raw=p.read_bytes()
              sha=hashlib.sha256(raw).hexdigest()
              status="PASS";error=""
              try:
                  text=raw.decode("utf-8-sig")
                  if p.suffix==".py":ast.parse(text,filename=str(p))
                  elif p.suffix==".json":json.loads(text)
              except (SyntaxError,ValueError,UnicodeError) as ex:
                  status="FAIL";error=str(ex)[:220]
                  failures.append({"file":str(p),"kind":"VALIDATION","error":error})
              examined.append({"file":str(p),"sha256":sha,"validation":status})
          payload={
              "schema":"AIKO_CLOUD_EVOLUTION_QUALITY_GATE_V1",
              "source":"GITHUB_ACTIONS_INDEPENDENT_OF_ACER",
              "created_at_unix":int(time.time()),
              "repository":os.environ.get("GITHUB_REPOSITORY"),
              "commit":os.environ.get("GITHUB_SHA"),
              "checks":{"sha256":"PASS","python_ast":"PASS" if not any(x["kind"]=="VALIDATION" and x["file"].endswith(".py") for x in failures) else "FAIL","json_parse":"PASS" if not any(x["kind"]=="VALIDATION" and x["file"].endswith(".json") for x in failures) else "FAIL"},
              "checked_file_count":len(examined),
              "failures":failures,
              "files":examined,
              "quality_gate":"PASS" if not failures else "FAIL",
              "safety":{"changes_to_acer":False,"deploy":False,"secrets_access":False,"paid_models":False}
          }
          out=pathlib.Path("artifacts/aiko-cloud-evolution-quality-gate.json")
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(f"AIKO_CLOUD_QUALITY_GATE_{payload['quality_gate']}: {len(examined)} files, {len(failures)} failures")
          if failures:raise SystemExit(1)
          PY
      - name: Assert AIKO and BOOM project separation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path(".")
          policy=json.loads((root/"cloud_b8_003/federation_policy.json").read_text())
          assert policy.get("project_identity")=="AIKO"
          assert all(value is False for value in policy["project_separation"].values())
          assert not (root/".github/workflows/boom-member-production-smoke.yml").exists()
          assert not (root/"cloud_b8_003/global_public_cert.py").exists()
          scoped=[root/"cloud_b8_003/README.md",
                  root/".github/workflows/aiko-cloud-evolution-quality-gate.yml"]
          boom_domains=("organization-it"+".vercel.app", "members."+"espartaaps.it")
          for source in scoped:
              body=source.read_text().lower()
              assert all(host not in body for host in boom_domains), str(source)
          print("AIKO_PROJECT_ISOLATION_PASS")
          PY
      - name: Verify strict AIKO project ownership and safe dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 aiko_cloud_chess_executor.py
          python3 - <<'PY'
          import json
          x=json.load(open('aiko_cloud_results.json', encoding='utf-8'))
          assert x['project_boundary']['accepted']==11
          assert x['project_boundary']['held']==0
          assert x['project_boundary']['mutation_count']==0
          assert x['cloud_authorized_to_deploy'] is False
          print('AIKO_OWNER_BOUNDARY_PASS')
          PY
      - name: Verify B8-003 300 ephemeral recovery cases
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud_b8_003/acceptance.py
      - name: Verify fenced synthetic B8 apply and rollback receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud_b8_003/shadow_cycle.py > artifacts/b8-shadow-fenced-rollback-proof.json
          python3 - <<'PY'
          import json, pathlib
          proof=json.loads(pathlib.Path("artifacts/b8-shadow-fenced-rollback-proof.json").read_text())
          if (proof.get("schema")!="AIKO_B8_SHADOW_FENCED_ROLLBACK_PROOF_V1"
              or proof.get("result")!="SYNTHETIC_SHADOW_PASS"
              or proof.get("state")!="ROLLED_BACK"
              or any(proof.get(key) is not False for key in
                 ("owner_release_authorized","independent_codex_approval",
                  "real_growth_source","production_deployment","B8_global_certified"))):
              raise SystemExit("AIKO_B8_SHADOW_NO_GO_OR_ROLLBACK_FAILED")
          print("AIKO_B8_FENCED_SHADOW_ROLLBACK_PASS")
          PY
      - name: Test 100 real child process crashes and persisted recovery off ACER
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud_b8_003/real_process_crash.py
      - name: Independently check 100-crash recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          with open('artifacts/b8-003-real-process-crash-proof.json',encoding='utf8') as f:
              receipt=json.load(f)
          assert receipt['schema']=='AIKO_B8_003_REAL_PROCESS_CRASH_QA_V1'
          assert receipt['repository']==os.environ['GITHUB_REPOSITORY']
          assert receipt['commit']==os.environ['GITHUB_SHA']
          assert receipt['run_id']==os.environ['GITHUB_RUN_ID']
          assert receipt['actual_child_processes_killed']==100
          assert all(n==100 for n in receipt['cases'].values())
          assert receipt['production_deployment'] is False
          assert receipt['real_growth_source'] is False
          assert receipt['B8_global_certified'] is False
          print('AIKO_REAL_CRASH_INDEPENDENT_RECEIPT_PASS')
          PY
      - name: Verify persisted synthetic receipt from an earlier GitHub run
        shell: bash
        env:
          GH_TOKEN_FOR_ARTIFACT_READ: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 cloud_b8_003/cross_run_artifact.py
      - name: Sign GitHub provenance for synthetic B8 cross-run receipt
        uses: actions/attest@v4
        with:
          subject-path: artifacts/b8-crossrun-artifact-proof.json
          create-storage-record: false
      - name: Verify signed B8 provenance independently with GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify artifacts/b8-crossrun-artifact-proof.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aiko-cloud-evolution-quality-gate.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > artifacts/b8-crossrun-attestation-verified-raw.json
          python3 - <<'PY'
          import json, pathlib, os, hashlib
          raw=pathlib.Path('artifacts/b8-crossrun-attestation-verified-raw.json')
          att=json.loads(raw.read_text())
          assert isinstance(att,list) and att
          assert all(isinstance(r.get('verificationResult'),dict) for r in att)
          source=pathlib.Path('artifacts/b8-crossrun-artifact-proof.json')
          receipt=json.loads(source.read_text())
          assert receipt.get('full_growth_delivery_certified') is False
          assert receipt.get('acer_physical_off_verified') is False
          summary={
            'schema':'AIKO_B8_GITHUB_CRYPTO_PROVENANCE_VERIFY_V1',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'subject_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'verified_attestations':len(att),
            'scope':'SYNTHETIC_CLOUD_QA_NOT_GROWTH_RELEASE',
            'production_certified':False,
            'owner_release_authorized':False
          }
          pathlib.Path('artifacts/b8-crossrun-attestation-verified.json').write_text(
              json.dumps(summary,sort_keys=True,indent=2)+'\n')
          raw.unlink()
          print('AIKO_SIGNED_CROSSRUN_ATTESTATION_VERIFIED',len(att))
          PY
      - name: Sign GHOST-only fenced rollback evidence
        uses: actions/attest@v4
        with:
          subject-path: artifacts/b8-shadow-fenced-rollback-proof.json
          create-storage-record: false
      - name: Independently verify signed GHOST rollback provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify artifacts/b8-shadow-fenced-rollback-proof.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aiko-cloud-evolution-quality-gate.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > artifacts/b8-shadow-fenced-attestation-verified-raw.json
          python3 - <<'PY'
          import json,pathlib,hashlib,os
          root=pathlib.Path("artifacts")
          signed=json.loads((root/"b8-shadow-fenced-attestation-verified-raw.json").read_text())
          receipt=json.loads((root/"b8-shadow-fenced-rollback-proof.json").read_text())
          if not isinstance(signed,list) or not signed or not all(
              isinstance(x.get("verificationResult"),dict) for x in signed):
              raise SystemExit("AIKO_SHADOW_ATTESTATION_INVALID")
          if receipt["B8_global_certified"] is not False or receipt["owner_release_authorized"] is not False:
              raise SystemExit("AIKO_SHADOW_RELEASE_CLAIM_DENIED")
          (root/"b8-shadow-fenced-attestation-verified.json").write_text(
              json.dumps({"schema":"AIKO_B8_SHADOW_ATTESTATION_VERIFIED_V1",
              "repository":os.environ["GITHUB_REPOSITORY"],
              "commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],
              "receipt_sha256":hashlib.sha256((root/"b8-shadow-fenced-rollback-proof.json").read_bytes()).hexdigest(),
              "verified_attestations":len(signed),
              "scope":"SYNTHETIC_GHOST_ONLY",
              "growth_autonomous_certified":False,
              "production_authorized":False},sort_keys=True,indent=2)+"\n")
          (root/"b8-shadow-fenced-attestation-verified-raw.json").unlink()
          print("AIKO_B8_GHOST_SHADOW_ATTESTATION_VERIFIED",len(signed))
          PY
      - name: Upload AIKO-only synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiko-b8-003-isolated-recovery-proof
          path: |
            artifacts/b8-003-cloud-acceptance.json
            artifacts/b8-003-real-process-crash-proof.json
            artifacts/b8-crossrun-artifact-proof.json
            artifacts/b8-crossrun-attestation-verified.json
            artifacts/b8-shadow-fenced-rollback-proof.json
            artifacts/b8-shadow-fenced-attestation-verified.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload durable quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiko-cloud-evolution-quality-gate
          path: artifacts/aiko-cloud-evolution-quality-gate.json
          if-no-files-found: error
          retention-days: 14

name: AIKO Cloud Independent Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    paths:
      - '.github/workflows/aiko-cloud-independent-probe.yml'
permissions:
  contents: read
concurrency:
  group: aiko-cloud-readonly-probe
  cancel-in-progress: false
jobs:
  cloud-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public worker independently of ACER
        env:
          HEALTH_URL: https://aiko-zero-cost-probe.jeanf1982.workers.dev/
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,urllib.request
          url=os.environ['HEALTH_URL']
          request=urllib.request.Request(url,method='GET',headers={'Accept':'text/plain','User-Agent':'AIKO-Cloud-ReadOnly-Probe/1'})
          with urllib.request.urlopen(request,timeout=9) as response:
              status=response.status
              body=response.read(4096)
              content_type=response.headers.get('Content-Type','')
          observation={
              'schema':'AIKO_CLOUD_INDEPENDENT_HTTP_PROBE_V1',
              'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'status':status,
              'content_type':content_type,
              'body_len':len(body),
              'body_sha256':hashlib.sha256(body).hexdigest(),
              'acer_needed':False,
              'gpt_gemini_autonomous_dialogue_certified':False,
              'no_secrets_used':True
          }
          print(json.dumps(observation,sort_keys=True))
          if status!=200 or not body:
              raise SystemExit('Worker unavailable or empty response')
          PY
      - name: Verify synthetic idempotent job ACK and crash resume
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tempfile
          # Sandbox-only: no user payload, cloud API credential, inference or production writes.
          with tempfile.TemporaryDirectory(prefix="aiko-cloud-test-") as directory:
              receipt=os.path.join(directory,"job.json")
              job={"id":"SYNTHETIC-CLOUD-TEST","payload":"public-placeholder","privacy":"PUBLIC_NON_SENSITIVE"}
              request_hash=hashlib.sha256(json.dumps(job,sort_keys=True).encode()).hexdigest()
              def persist(state,ack=False):
                  with open(receipt,"w",encoding="utf-8") as handle:
                      json.dump({"job_id":job["id"],"request_sha256":request_hash,"state":state,"ack":ack},handle)
              persist("PREPARED")
              persist("QUEUED")
              persist("DISPATCHED")
              persist("EXECUTING")
              result_hash=hashlib.sha256(b"synthetic-success").hexdigest()
              persist("RESULT_WRITTEN") # Simulates interruption before ACK.
              with open(receipt,encoding="utf-8") as handle:
                  resumed=json.load(handle)
              assert resumed["state"]=="RESULT_WRITTEN" and resumed["request_sha256"]==request_hash
              persist("ACKED",True)
              with open(receipt,encoding="utf-8") as handle:
                  ack=json.load(handle)
              assert ack["ack"] and ack["request_sha256"]==request_hash
              persist("DONE",True)
              print(json.dumps({"schema":"AIKO_CLOUD_SYNTHETIC_JOB_ACK_V1","job_state":"DONE","resume_test":"PASS","idempotency_key_checked":True,"result_sha256":result_hash,"storage_scope":"EPHEMERAL_SAME_RUN_ONLY","acer_required":False,"real_ai_inference":False,"durable_cloud_queue_certified":False,"zero_paid_services":True},sort_keys=True))
          PY
